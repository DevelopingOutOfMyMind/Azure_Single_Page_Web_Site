name: "CodeQL Security Scan"

on:
  push:
    branches:
      - '**' # Triggers the workflow on push events to all branches

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: CodeQL Autobuild
      uses: github/codeql-action/autobuild@v3
      # autobuild will attempt to build the project (dotnet build)
      # It must run after init and before analyze so the C# extractor can process binaries.

    - name: Restore dependencies (with retry)
      run: |
        set -e
        n=0
        until [ $n -ge 3 ]
        do
          dotnet restore && break
          n=$((n+1))
          echo "dotnet restore failed - retrying ($n/3)"
          sleep 5
        done
      shell: bash

    - name: Upload restore logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: restore-logs
        path: |
          ~/.nuget/packages
          ~/.local/share/NuGet

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Run unit tests
      run: |
        dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
      continue-on-error: false
      # Upload test results would normally be done here with actions/upload-artifact

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          **/test-results.trx

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        output: codeql-results.sarif
        upload: false

    - name: Upload CodeQL SARIF
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: codeql-sarif
        path: codeql-results.sarif